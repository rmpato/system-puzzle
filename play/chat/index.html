<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="app-base" content="/under-load/" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Under Load</title>
<meta name="description" content="Practice system design interviews by building the architecture while live traffic flows through it. Nine exercises and a field guide." />
<link rel="icon" href="/under-load/favicon-2qya92nw.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=IBM+Plex+Mono:wght@400;500;600&family=Architects+Daughter&display=swap" rel="stylesheet" />
<style>
  /* ── Identity: the whiteboard.
     A system design interview happens at a whiteboard, so the product is one: a near-white board,
     black marker for structure, and the three marker colors that mean something in the game:
     blue = your design and the live requests, green = healthy, red = failing. Amber is reserved for traps.
     One type family (IBM Plex Sans, Plex Mono for numbers and labels) and one hand,
     Architects Daughter, used only for the interviewer's voice: the prompt, their replies, notes on the board. */
  :root {
    color-scheme: light;
    --paper: #f3f3f0;
    --paper-2: #e9e9e4;
    --paper-3: #dcdcd5;
    --card: #ffffff;
    --ink: #15171c;
    --ink-2: #363b44;
    --muted: #6b7079;
    --line: #dddcd5;
    --hair: rgba(21, 23, 28, .11);
    --blue: #2450e8;
    --blue-2: #1a3cc0;
    --blue-bg: #ebefff;
    --good: #12804a;
    --good-bg: #e4f3e9;
    --bad: #d93a26;
    --bad-bg: #fdebe7;
    --warn: #c27406;
    --note: #fff3b8;
    --font-display: 'IBM Plex Sans', system-ui, -apple-system, sans-serif;
    --font-body: 'IBM Plex Sans', system-ui, -apple-system, sans-serif;
    --font-mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
    --font-hand: 'Architects Daughter', 'Segoe Print', cursive;
    --r: 12px;
    --shadow: 0 1px 2px rgba(21,23,28,.05), 0 6px 20px -10px rgba(21,23,28,.22);
    --shadow-lg: 0 1px 2px rgba(21,23,28,.05), 0 24px 60px -24px rgba(21,23,28,.35);
    --ease: cubic-bezier(.2, .8, .2, 1);
    --ease-out: cubic-bezier(.16, 1, .3, 1);
    --gap-l: max(16px, env(safe-area-inset-left, 0px));
    --gap-r: max(16px, env(safe-area-inset-right, 0px));
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--paper); color: var(--ink); font: 14px/1.5 var(--font-body); -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; text-rendering: optimizeLegibility; font-kerning: normal; font-optical-sizing: auto; font-synthesis: none; }
  /* font-synthesis: none: never fake a bold the font files don't have (Architects Daughter ships a single weight) */
  p, li, .sub, .idea { text-wrap: pretty; hanging-punctuation: first; }
  .num, .nums b, .stat > b, .titleblock b, .err b { font-variant-numeric: lining-nums tabular-nums; }
  button { font: inherit; color: inherit; cursor: pointer; }
  #home a, #learn a { color: inherit; text-decoration: none; }
  a.btn { color: #fff !important; text-decoration: none; }
  button:focus-visible, a:focus-visible, input:focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; }
  ::selection { background: var(--blue); color: #fff; }
  code { font: 500 .9em var(--font-mono); padding: 0 .3em; border-radius: 4px; background: var(--paper-2); }
  svg.i { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  #c { position: fixed; inset: 0; display: block; touch-action: none; }
  .labels { position: fixed; inset: 0; pointer-events: none; }
  /* a soft vignette over the board: the edges fall away like a lit tabletop */
  .labels::before { content: ''; position: fixed; inset: 0; pointer-events: none; background: radial-gradient(120% 90% at 50% 42%, transparent 58%, rgba(21,23,28,.07) 100%); }

  /* ── type */
  h1, h2, h3 { font-family: var(--font-display); font-weight: 600; letter-spacing: -.02em; text-wrap: balance; margin: 4px 0 10px; line-height: 1.1; }
  h1 { font-size: 34px; }
  h2 { font-size: 26px; }
  h3 { font: 600 11px/1.2 var(--font-mono); letter-spacing: .1em; text-transform: uppercase; margin: 0 0 8px; color: var(--muted); }
  .eyebrow { font: 500 11px/1.3 var(--font-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .eyebrow.danger { color: var(--bad); }
  .hand { font-family: var(--font-hand); font-size: 18px; line-height: 1.45; }
  .sub { color: var(--muted); font-size: 15.5px; margin: 0 0 14px; }

  /* ── in-world labels */
  .lbl { font: 600 12.5px/1.15 var(--font-body); padding: 5px 9px 5px 6px; border-radius: 9px; background: rgba(255,255,255,.95); border: 1px solid var(--ink); box-shadow: 0 6px 16px -8px rgba(18,20,23,.45); white-space: nowrap; text-align: center; color: var(--ink); }
  .lbl .t { display: flex; align-items: center; justify-content: center; gap: 6px; }
  .lbl.ext { border-style: dashed; box-shadow: none; background: rgba(255,255,255,.8); color: var(--muted); }
  .gx { width: 18px; height: 18px; flex: none; object-fit: contain; }
  .gx.emo { display: inline-grid; place-items: center; font-size: 15px; line-height: 1; }
  .gx.sm { width: 17px; height: 17px; vertical-align: -3px; }
  .gx.lg { width: 36px; height: 36px; } .gx.lg.emo { font-size: 30px; }
  .gx.big { width: 26px; height: 26px; display: block; margin: 0 auto 3px; } .gx.big.emo { font-size: 22px; }
  .lbl.warn { background: #fff0ec; border-color: var(--bad); color: var(--bad); }
  .lbl .g { display: block; width: 100%; min-width: 64px; height: 4px; margin: 4px auto 1px; border-radius: 3px; background: var(--paper-3); overflow: hidden; }
  .lbl .g i { display: block; height: 100%; transition: width .4s, background .4s; }
  .lbl .gl { display: flex; align-items: center; gap: 6px; margin-top: 4px; }
  .lbl .gl .g { margin: 0; flex: 1; min-width: 44px; }
  .lbl .gl em { font: 500 10.5px var(--font-mono); font-style: normal; color: var(--muted); white-space: nowrap; }
  .lbl .xt { display: block; font: 500 10px var(--font-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin-bottom: 2px; }
  /* never animate transform on a CSS2D label element itself: it overrides the positioning transform */
  .ghost { font: 400 15px/1 var(--font-hand); color: var(--muted); opacity: .85; text-align: center; transition: opacity .2s; }
  .ghost .gi { transition: transform .2s; font-size: 13px; line-height: 1.1; }
  .ghost .gx { filter: grayscale(1); opacity: .5; }
  .ghost.hint { color: var(--blue); opacity: 1; }
  .ghost.hint .gi { animation: bob .9s ease-in-out infinite alternate; }
  .ghost.hint .gx { filter: none; opacity: 1; }
  .ghost.hot { opacity: 1; color: var(--blue); }
  .ghost.hot .gi { transform: scale(1.15); }
  .ghost.hot .gx { filter: none; opacity: 1; }
  .ghost.quiet { opacity: .62; }
  .ghost.quiet .gx { display: none; }
  .ghost .gn { display: block; white-space: nowrap; }
  .ghost .gp { display: block; font: 500 10.5px var(--font-mono); margin-top: 2px; letter-spacing: .04em; }
  .ghost.quiet .gn { font-size: 13px; }
  @keyframes bob { to { transform: translateY(-5px); } }
  .float { pointer-events: none; }
  .float span { display: block; font: 700 18px var(--font-hand); animation-duration: 1.6s !important; color: var(--good); animation: rise 1s ease-out forwards; text-shadow: 0 1px 0 #fff, 0 0 6px #fff; white-space: nowrap; }
  .float.bad span { color: var(--bad); }
  @keyframes rise { from { transform: translateY(0); opacity: 1; } to { transform: translateY(-40px); opacity: 0; } }
  .here-wrap { pointer-events: none; }
  .here { font: 700 20px var(--font-hand); color: var(--bad); background: #fff; border: 1.5px solid var(--bad); border-radius: 8px; padding: 2px 10px; animation: bob .5s ease-in-out infinite alternate; }
  .lbl .failing { display: block; font: 700 13px var(--font-hand); color: var(--bad); }

  /* ── HUD: an instrument strip */
  #hud { position: fixed; top: max(14px, env(safe-area-inset-top, 0px)); left: var(--gap-l); right: var(--gap-r); display: flex; gap: 8px; align-items: stretch; pointer-events: none; z-index: 5; }
  #hud[hidden] { display: none; }
  .hud-stats { display: contents; }
  .iconbtn:disabled { opacity: .35; cursor: default; }
  .iconbtn:disabled:hover { background: transparent; }
  .note { background: rgba(255,255,255,.92); border: 1px solid var(--hair); border-radius: 14px; box-shadow: var(--shadow); padding: 9px 14px; backdrop-filter: blur(10px) saturate(1.2); }
  .stat small { display: block; font: 500 10px/1.2 var(--font-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-bottom: 3px; }
  .stat > b { display: inline-block; min-width: 3.2ch; font: 500 24px/1 var(--font-mono); font-variant-numeric: tabular-nums; letter-spacing: -.03em; }
  .stat .rate { font: 500 11.5px var(--font-mono); margin-left: 7px; font-variant-numeric: tabular-nums; }
  .rate.up { color: var(--good); } .rate.down { color: var(--bad); }
  .bar { height: 4px; border-radius: 3px; background: var(--paper-3); margin-top: 7px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--ink); transition: width .3s; }
  #phase { min-width: 290px; }
  #phase > b { font: 600 24px/1 var(--font-display); letter-spacing: -.025em; }
  .phases { display: flex; gap: 3px; margin-top: 9px; }
  .phases i { position: relative; height: 4px; border-radius: 3px; background: var(--paper-3); }
  .phases i b { display: block; height: 100%; border-radius: 3px; background: var(--ink); transition: width .3s; }
  .phases i.now b { background: var(--blue); }
  .phases em { position: absolute; top: -14px; transform: translateX(-50%); font-style: normal; font-size: 10px; line-height: 1; }
  #rep { min-width: 150px; }
  #rep .bar i { background: var(--warn); }
  #rep.low b { color: var(--bad); }
  .spacer { flex: 1; }
  .surge { font: 600 10px/1 var(--font-mono); letter-spacing: .1em; text-transform: uppercase; color: #fff; background: var(--bad); padding: 4px 7px; border-radius: 99px; vertical-align: 5px; margin-left: 6px; animation: pulse 1s ease-in-out infinite; display: inline-block; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 6px rgba(226,57,31,.18); } }
  .legend { display: flex; gap: 12px; align-items: center; font-size: 12px; font-weight: 500; }
  .legend i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }
  .legend > span { white-space: nowrap; }
  .legend.top { flex-wrap: wrap; row-gap: 4px; max-width: 760px; }
  .legend i.ev { border-radius: 2px; transform: rotate(45deg); }
  .lg-h { font: 500 10.5px var(--font-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .lg-h + span { margin-left: -4px; }
  .legend .lg-h:not(:first-child) { margin-left: 6px; padding-left: 12px; border-left: 1px solid var(--line); }
  .hud-tools { display: flex; gap: 2px; padding: 4px; pointer-events: auto; align-items: center; }
  .iconbtn { pointer-events: auto; min-width: 40px; height: 40px; display: grid; place-items: center; padding: 0 8px; border: 0; background: transparent; border-radius: 10px; font: 500 12px var(--font-mono); transition: background .15s; }
  .iconbtn:hover { background: var(--paper-2); }

  /* ── shop: the parts drawer */
  #shop { position: fixed; left: 0; right: 0; bottom: 0; display: flex; align-items: flex-end; gap: 18px; overflow-x: auto; padding: 34px var(--gap-r) max(14px, env(safe-area-inset-bottom, 0px)) var(--gap-l); scrollbar-width: none; background: linear-gradient(to top, rgba(243,243,240,.98) 58%, rgba(243,243,240,0)); z-index: 4; }
  #shop[hidden] { display: none; }
  #shop::before, #shop::after { content: ''; margin: auto; }
  .grp { flex: none; display: grid; gap: 7px; }
  .grp-l { font: 500 10.5px var(--font-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); padding-left: 2px; display: flex; align-items: center; gap: 8px; }
  .grp-l::after { content: ''; flex: 1; height: 1px; background: var(--line); }
  .grp-i { display: flex; gap: 6px; }
  .item { flex: none; width: 98px; padding: 10px 6px 9px; text-align: center; background: var(--card); border: 1px solid var(--hair); border-radius: 14px; box-shadow: var(--shadow); position: relative; transition: transform .25s var(--ease-out), box-shadow .25s var(--ease-out), border-color .2s; }
  .item:hover:not([aria-disabled="true"]) { transform: translateY(-4px); border-color: var(--ink); box-shadow: var(--shadow-lg); }
  .item:active:not([aria-disabled="true"]) { transform: translateY(0) scale(.97); }
  .item .ic { display: block; height: 32px; margin-bottom: 4px; }
  .item .ic .gx { width: 30px; height: 30px; display: block; margin: 1px auto 0; }
  .item .ic .gx.emo { font-size: 24px; line-height: 30px; }
  .item.poor .ic .gx { filter: grayscale(.9); opacity: .55; }
  .item .fill { position: absolute; left: 12px; right: 12px; bottom: 5px; height: 2px; border-radius: 2px; background: var(--paper-3); overflow: hidden; }
  .item .fill i { display: block; height: 100%; background: var(--blue); transition: width .4s; }
  .item b { display: block; font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item .p { font: 500 12px var(--font-mono); color: var(--blue); }
  .item.trap .p { color: var(--warn); }
  .item.poor .p { color: var(--bad); }
  .item[aria-disabled="true"] { cursor: not-allowed; }
  .item.poor { background: rgba(255,255,255,.55); box-shadow: none; }
  .item.poor b { color: var(--muted); }
  .item .wait { position: absolute; top: 5px; right: 7px; font: 500 10px var(--font-mono); font-style: normal; color: var(--muted); }
  .item.credit .p { color: var(--good); }
  .item.done { opacity: .55; box-shadow: none; border-style: dashed; border-color: var(--line); background: transparent; }
  .item.done .p { color: var(--good); }
  .item .n { position: absolute; top: 5px; right: 7px; font: 600 10.5px var(--font-mono); color: var(--blue); }
  .item.poor .n { display: none; }
  .item .k { position: absolute; top: 5px; left: 7px; font: 500 10px var(--font-mono); color: var(--muted); }
  .item.hint:not(.done) { border-color: var(--blue); animation: nudge .9s ease-in-out infinite alternate; }
  @keyframes nudge { from { box-shadow: 0 0 0 0 rgba(36,72,245,0), var(--shadow); } to { box-shadow: 0 0 0 6px rgba(36,72,245,.18), var(--shadow); transform: translateY(-4px); } }
  #tip { position: fixed; width: 270px; padding: 12px 14px; font-size: 13px; pointer-events: none; z-index: 7; }
  #tip[hidden] { display: none; }
  .tip-h { display: flex; gap: 10px; align-items: center; margin-bottom: 7px; }
  .tip-h .gx { width: 30px; height: 30px; } .tip-h .gx.emo { font-size: 22px; }
  .tip-h b { display: block; font: 600 17px/1.1 var(--font-display); }
  .tip-h small { display: block; font: 500 10.5px var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-top: 3px; }
  .tip-up { margin-top: 6px; color: var(--warn); font: 500 11.5px var(--font-mono); }
  .tip-cr { margin-top: 6px; color: var(--good); font-weight: 600; }

  #banner { position: fixed; top: 30%; left: 0; right: 0; text-align: center; pointer-events: none; opacity: 0; transform: translateY(16px); transition: opacity .5s var(--ease-out), transform .6s var(--ease-out); z-index: 5; }
  #banner.show { opacity: 1; transform: none; }
  #banner b { display: block; font: 600 clamp(48px, 7vw, 88px)/.95 var(--font-display); letter-spacing: -.04em; text-shadow: 0 2px 30px rgba(243,243,240,.9); }
  #banner .news { display: inline-flex; gap: 14px; margin-top: 14px; padding: 6px 14px; font: 500 12px var(--font-mono); letter-spacing: .06em; text-transform: uppercase; background: rgba(251,250,246,.92); border: 1px solid var(--hair); border-radius: 99px; }
  #banner .news:empty { display: none; }
  #banner .news i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
  #pause { position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none; font: 400 64px var(--font-hand); color: var(--ink); background: rgba(243,243,240,.45); backdrop-filter: blur(2px); z-index: 5; }
  #pause[hidden] { display: none; }

  /* ── modals: sheets of paper on the board */
  #modal { position: fixed; inset: 0; display: grid; place-items: center; padding: 16px; background: rgba(243,243,240,.55); backdrop-filter: blur(6px); z-index: 10; }
  #modal[hidden] { display: none; }
  .card { width: min(560px, 100%); max-height: calc(100vh - 32px); overflow: auto; background: var(--card); border: 1px solid var(--hair); border-radius: 16px; box-shadow: var(--shadow-lg); padding: 30px 32px 26px; animation: sheetIn .45s var(--ease-out); scrollbar-width: thin; }
  .card.center { text-align: center; }
  .card.wide { width: min(700px, 100%); }
  @keyframes sheetIn { from { opacity: 0; transform: translateY(16px); } }
  @keyframes pop { from { opacity: 0; transform: translateY(10px) scale(.97); } }
  .brief { margin: 16px 0 20px; padding: 16px 20px; background: var(--paper); border-radius: var(--r); border: 1px solid var(--line); color: var(--ink); font-size: 19px; }
  .big-ic { font-size: 40px; line-height: 1; margin-top: 4px; }
  .opts { display: grid; gap: 8px; }
  .opt { padding: 13px 16px; background: var(--card); border: 1px solid var(--line); border-radius: var(--r); font-weight: 500; font-size: 14.5px; line-height: 1.4; text-align: inherit; transition: transform .2s var(--ease-out), border-color .15s, background .15s, box-shadow .2s; }
  .opt:hover:not(:disabled) { border-color: var(--ink); box-shadow: inset 3px 0 0 var(--ink); }
  .card.center .opt:hover:not(:disabled) { box-shadow: 0 0 0 1px var(--ink); }
  .opt.on { background: var(--blue-bg); border-color: var(--blue); color: var(--ink); box-shadow: 0 0 0 1px var(--blue); }
  .opt:disabled { cursor: default; color: var(--muted); }
  div.opt { cursor: default; }
  .opt.right { background: var(--good-bg); border-color: var(--good); color: var(--ink); }
  .opt.wrong { background: var(--bad-bg); border-color: var(--bad); color: var(--ink); }
  .opt small { display: block; margin-top: 4px; font: 400 15px/1.3 var(--font-hand); color: var(--muted); }
  .opt.seq { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; text-align: left; }
  .opt.seq small { flex-basis: 100%; margin-left: 38px; }
  .num { flex: none; width: 26px; height: 26px; border-radius: 50%; border: 1px dashed var(--muted); display: grid; place-items: center; font: 500 12px var(--font-mono); }
  .opt.on .num, .opt.right .num, .opt.wrong .num { border-style: solid; background: var(--ink); border-color: var(--ink); color: #fff; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .chip { padding: 9px 15px; background: var(--card); border: 1px solid var(--line); border-radius: 999px; transition: transform .2s var(--ease-out), border-color .15s; }
  .chip:hover:not(:disabled) { transform: translateY(-2px); border-color: var(--ink); }
  .chip:disabled { cursor: default; }
  .chip:disabled:not(.on):not(.right):not(.wrong):not(.miss) { opacity: .45; }
  .chip.on { background: var(--blue-bg); border-color: var(--blue); }
  .chip.right { background: var(--good-bg); border-color: var(--good); }
  .chip.wrong { background: var(--bad-bg); border-color: var(--bad); }
  .chip.miss { border-color: var(--good); border-style: dashed; }
  .chip.off { opacity: .4; }
  .chip code, .bucket code { background: none; padding: 0; }
  .chip small { display: block; font: 400 14px var(--font-hand); color: var(--muted); }
  .sort { display: grid; gap: 8px; text-align: left; }
  .sort-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 9px 12px; border: 1px solid var(--line); border-radius: 12px; }
  .sort-row.right { border-color: var(--good); background: var(--good-bg); }
  .sort-row.wrong { border-color: var(--bad); background: var(--bad-bg); }
  .sort-t { flex: 1 1 180px; font-weight: 500; min-width: 0; }
  .sort-t small { display: block; font: 400 14px var(--font-hand); color: var(--muted); }
  .sort-b { display: flex; gap: 5px; flex-wrap: wrap; }
  .bucket { padding: 5px 11px; font-size: 12.5px; background: var(--card); border: 1px solid var(--line); border-radius: 99px; white-space: nowrap; transition: background .15s, border-color .15s; }
  .bucket:hover:not(:disabled) { border-color: var(--ink); }
  .bucket.on { background: var(--ink); border-color: var(--ink); color: #fff; }
  .bucket:disabled { cursor: default; opacity: .55; }
  .bucket.on:disabled { opacity: 1; }
  .sort-row.wrong .bucket.on { background: var(--bad); border-color: var(--bad); }
  .bucket.ans { outline: 2px solid var(--good); outline-offset: 1px; opacity: 1; }
  .row { display: flex; align-items: center; gap: 10px; margin-top: 22px; flex-wrap: wrap; }
  .row .grow { flex: 1; text-align: left; }
  .btn { display: inline-flex; align-items: center; gap: 8px; padding: 12px 20px; background: var(--ink); color: #fff; border: 1px solid var(--ink); border-radius: 10px; font-weight: 500; transition: transform .2s var(--ease-out), background .2s, box-shadow .2s, border-color .2s; }
  .btn:hover:not(:disabled) { background: var(--blue); border-color: var(--blue); }
  .btn:disabled { opacity: .35; cursor: not-allowed; }
  .btn.alt { background: transparent; color: var(--ink); border-color: var(--line); }
  .btn.alt:hover:not(:disabled) { background: var(--card); border-color: var(--ink); color: var(--ink); box-shadow: none; }
  .link { border: none; background: none; padding: 4px 0; color: var(--ink); font-weight: 500; text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 4px; transition: text-decoration-color .2s; }
  .link:hover { text-decoration-color: var(--ink); }
  .link:disabled { color: var(--line); cursor: default; }
  .delta { font: 500 22px var(--font-mono); letter-spacing: -.03em; }
  .delta.up { color: var(--good); } .delta.down { color: var(--bad); }
  .fix { font: 700 16px var(--font-hand); color: var(--blue); }
  .steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 6px 0 4px; }
  .steps div { font: 700 15px/1.2 var(--font-hand); }
  .steps span { display: block; font-size: 26px; margin-bottom: 4px; }
  .legend.wide { justify-content: center; flex-wrap: wrap; margin-top: 14px; color: var(--muted); }
  .keys { margin-top: 12px; font-size: 12px; color: var(--muted); }
  kbd { font: 500 10.5px var(--font-mono); padding: 2px 6px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; color: var(--ink); background: var(--card); }
  .coach { position: fixed; left: 50%; bottom: 122px; transform: translateX(-50%) rotate(-1.5deg); padding: 9px 16px; background: var(--note); border-radius: 2px; box-shadow: 0 14px 24px -14px rgba(0,0,0,.45); font: 700 19px var(--font-hand); pointer-events: none; z-index: 6; animation: coach .9s ease-in-out infinite alternate; transition: opacity .6s; }
  .coach span { display: block; font-weight: 400; font-size: 15px; color: var(--muted); }
  .coach.out { opacity: 0; }
  @keyframes coach { to { bottom: 130px; } }
  #modal.docked { place-items: center end; background: transparent; backdrop-filter: none; pointer-events: none; }
  #modal.docked .card { pointer-events: auto; width: min(430px, 100%); margin-right: 8px; text-align: left; }
  #modal.docked .big-ic { font-size: 34px; }
  .mode-strip { display: inline-flex; align-items: center; gap: 6px; font: 500 10.5px var(--font-mono); letter-spacing: .12em; text-transform: uppercase; padding: 5px 10px; border-radius: 999px; margin-bottom: 8px; }
  .mode-strip.live { background: var(--bad); color: #fff; }
  .mode-strip.live::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: #fff; animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .mode-strip.ask { background: var(--ink); color: var(--paper); }
  .mode-strip.board { background: var(--note); color: var(--ink); }
  /* live incident: docked beside the running board (never blocks it) */
  #modal.docked.left { place-items: center start; }
  #modal.docked.left .card.incident { margin: 0 0 0 8px; animation-name: incInL; }
  @keyframes incInL { from { opacity: 0; transform: translateX(-24px); } }
  #modal.docked .card.incident { width: min(420px, 100%); margin-right: 8px; padding: 18px 20px 18px; text-align: left; border-top: 3px solid var(--bad); animation: incIn .35s var(--ease-out); }
  @keyframes incIn { from { opacity: 0; transform: translateX(24px); } }
  .inc-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
  .inc-h .mode-strip { margin: 0; }
  .inc-slow { display: inline-flex; align-items: center; gap: 6px; font: 500 10.5px var(--font-mono); letter-spacing: .04em; color: var(--muted); }
  .inc-slow::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--warn); animation: blink 1.4s steps(2) infinite; }
  .inc-t { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 12px; align-items: start; }
  .inc-ic { font-size: 30px; line-height: 1.1; }
  .inc-t h2 { font-size: 20px; margin: 0 0 2px; }
  .inc-t .sub { margin: 0 0 12px; font-size: 14px; }
  .fact { display: flex; align-items: center; gap: 8px; }
  .fact-pin { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--bad); animation: pulse 1s ease-in-out infinite; }
  .incident .opt { font-size: 14px; padding: 11px 14px; }
  .inc-foot { display: flex; align-items: center; gap: 12px; margin-top: 16px; flex-wrap: wrap; }
  .inc-foot .grow { flex: 1; }
  .btn.deploy { background: var(--blue); border-color: var(--blue); }
  .btn.deploy:hover:not(:disabled) { background: var(--blue-2); border-color: var(--blue-2); }
  .btn.deploy em { font-style: normal; font-size: 12px; opacity: .8; }
  .btn.deploy .gx { background: #fff; border-radius: 4px; padding: 1px; }
  .inc-more { margin: 12px 0 0; font: 500 11px var(--font-mono); color: var(--bad); }
  .inc-note { margin: 10px 0 0; font-size: 12.5px; color: var(--muted); }
  /* the design step: docked beside the empty board */
  #modal.docked:has(.card.design) { align-items: start; padding-top: 104px; }
  #modal.docked .card.design { width: min(430px, 100%); margin: 0 0 0 8px; padding: 18px 20px 16px; text-align: left; border-top: 3px solid var(--blue); max-height: calc(100vh - 104px - 150px); display: flex; flex-direction: column; animation: incInL .35s var(--ease-out); }
  .card.design .flows-check { overflow-y: auto; min-height: 0; flex: 1; margin-right: -6px; padding-right: 6px; scrollbar-width: thin; }
  .mode-strip.design { background: var(--blue); color: #fff; align-self: flex-start; }
  .card.design h2 { font-size: 21px; margin: 8px 0 4px; }
  .card.design .sub { font-size: 13.5px; line-height: 1.5; margin-bottom: 10px; }
  .prompt.sm { margin: 0 0 14px; padding: 8px 12px; border-radius: 10px; background: var(--paper); font-size: 15px; line-height: 1.4; }
  .prompt.sm::before { content: none; }
  .flows-h { margin: 0 0 8px; }
  .flows-check { display: grid; gap: 6px; }
  .fc { display: grid; grid-template-columns: 104px minmax(0, 1fr) auto; align-items: center; gap: 8px; padding: 6px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); }
  .fc.ok { border-color: #a9d8bc; }
  .fc.bad { border-color: #f1c2b9; background: #fffaf8; }
  .fc-t { display: flex; align-items: center; gap: 7px; font-size: 12.5px; font-weight: 600; min-width: 0; }
  .fc-t i { flex: none; }
  .fc-t i { width: 8px; height: 8px; border-radius: 50%; }
  .fc.ok::after { content: '✓'; color: var(--good); font-size: 13px; }
  .fc.bad::after { content: '✕'; color: var(--bad); font-size: 12px; }
  .fc:not(.ok):not(.bad) { grid-template-columns: 1fr; }
  .fc-path { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 0; }
  .fc-n { display: inline-flex; align-items: center; gap: 4px; padding: 1px 6px 1px 4px; border: 1px solid var(--ink); border-radius: 6px; font-size: 11.5px; background: var(--card); white-space: nowrap; }
  .fc-n.miss { padding: 2px 9px; border: 1.5px dashed var(--bad); color: var(--bad); font-weight: 600; background: #fff; }
  .fc-a { width: 10px; height: 1.3px; background: var(--ink); position: relative; flex: none; }
  .fc-a::after { content: ''; position: absolute; right: -1px; top: -3px; border: 3.5px solid transparent; border-left: 5px solid var(--ink); border-right: 0; }
  .card.design .row { margin-top: 14px; flex: none; }
  .design-note { font-size: 13px; color: var(--muted); }
  .design-note b { color: var(--bad); }
  .design-note .ok { color: var(--good); font-weight: 500; }
  /* "Your system" leads the parts bar */
  .grp.core .grp-l { color: var(--blue); }
  .grp.core .grp-l::after { background: #c9d4fb; }
  .grp.core .item:not(.done):not(.poor) { border-color: #c9d4fb; }
  /* whiteboard breaks: where you are in the session */
  .break-strip { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: -6px -8px 18px; padding: 9px 12px; border-radius: 10px; background: var(--paper); font: 500 10.5px var(--font-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .break-strip b { color: var(--ink); font-weight: 600; }
  .q-dots { display: inline-flex; gap: 5px; }
  .q-dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--paper-3); }
  .q-dots i.done { background: var(--ink); }
  .q-dots i.now { background: var(--blue); box-shadow: 0 0 0 3px var(--blue-bg); }
  .fact { margin: -2px 0 14px; padding: 9px 13px; border-radius: 10px; background: var(--bad-bg); border-left: 3px solid var(--bad); font-weight: 500; font-size: 14px; }
  .pick-hint { font: 500 10.5px var(--font-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
  .noted { font: 700 17px var(--font-hand); color: var(--ink); }
  .howto-title { margin: 18px 0 10px; }
  .howto { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; text-align: left; }
  .howto div { display: grid; gap: 3px; align-content: start; font-size: 12.5px; color: var(--muted); padding: 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--paper); }
  .howto b { color: var(--ink); font-size: 13px; }
  .dotrow { display: flex; gap: 4px; height: 22px; align-items: center; }
  .dotrow i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .tagdemo { justify-self: start; font: 700 13px var(--font-hand); color: var(--bad); background: #fff0ec; border: 1px solid var(--bad); border-radius: 6px; padding: 1px 6px; height: 22px; }
  .ringdemo { width: 22px; height: 22px; border-radius: 50%; background: conic-gradient(var(--good) 0 45%, var(--warn) 45% 70%, var(--bad) 70% 85%, var(--paper-3) 85%); -webkit-mask: radial-gradient(circle, transparent 6px, #000 6.5px); mask: radial-gradient(circle, transparent 6px, #000 6.5px); }
  .coach.left { left: 200px; transform: rotate(-1.5deg); }
  .slotdemo { width: 34px; height: 22px; border: 1.5px dashed var(--muted); border-radius: 3px; }
  .inspect-hint { margin: 12px 0 0; text-align: center; font-size: 13px; color: var(--muted); }

  /* ── debrief: a stamped drawing */
  .card.results { width: min(940px, 100%); padding: 34px 38px 28px; }
  .result-top { display: flex; gap: 26px; align-items: center; }
  .grade { font: 600 72px/.8 var(--font-display); letter-spacing: -.04em; width: 112px; height: 112px; display: grid; place-items: center; flex: none; border: 2.5px solid currentColor; border-radius: 50%; animation: stamp .6s .2s var(--ease-out) both; position: relative; }
  .grade::after { content: 'GRADE'; position: absolute; bottom: 14px; font: 600 9px var(--font-mono); letter-spacing: .3em; }
  @keyframes stamp { from { opacity: 0; transform: scale(1.6); } 70% { opacity: 1; transform: scale(.97); } }
  .grade.S, .grade.A { color: var(--good); } .grade.B { color: var(--blue); } .grade.C { color: var(--warn); } .grade.D, .grade.F { color: var(--bad); }
  .result-top h2 { font-size: 34px; }
  .nums { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0; margin: 22px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .nums div { padding: 12px 14px; border-left: 1px solid var(--line); }
  .nums div:first-child { border-left: 0; padding-left: 0; }
  .nums small { display: block; font: 500 10.5px var(--font-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .nums b { font: 500 32px/1.15 var(--font-mono); letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
  .snap { width: 100%; max-width: 100%; border: 1px solid var(--line); border-radius: 8px; display: block; margin: 4px 0 14px; }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; margin-top: 6px; }
  .cols ul, .ask ol { margin: 0; padding-left: 18px; font-size: 13.5px; display: grid; gap: 5px; }
  .cols .g h3 { color: var(--good); } .cols .r h3 { color: var(--bad); }
  .ask { margin-top: 20px; padding: 16px 20px; background: var(--paper); border: 1px solid var(--line); border-radius: var(--r); }
  .ask ol { font-size: 14px; gap: 6px; }
  .timeline, .review, .evo-d { margin-top: 14px; font-size: 13px; border-top: 1px solid var(--line); padding-top: 12px; }
  .timeline summary, .review summary, .evo-d summary { cursor: pointer; font: 500 11px var(--font-mono); letter-spacing: .1em; text-transform: uppercase; }
  .timeline ul { list-style: none; padding: 0; margin: 10px 0 0; display: grid; gap: 2px; max-height: 240px; overflow: auto; }
  .timeline li { display: flex; gap: 8px; padding: 4px 8px; border-radius: 6px; }
  .timeline li span { font: 500 11.5px var(--font-mono); color: var(--muted); flex: none; width: 40px; }
  .timeline li em { font-style: normal; color: var(--muted); flex: none; width: 92px; }
  .timeline li.good { background: var(--good-bg); }
  .timeline li.bad { background: var(--bad-bg); }
  .review ul { list-style: none; padding: 0; margin: 10px 0 0; display: grid; gap: 4px; }
  .review li { display: grid; gap: 2px; padding: 8px 12px; border-radius: 8px; border-left: 3px solid var(--good); background: var(--good-bg); }
  .review li.bad { border-left-color: var(--bad); background: var(--bad-bg); }
  .review li span { color: var(--muted); }
  .review li .best { color: var(--ink); }
  .review li em { font-style: normal; font-family: var(--font-hand); font-size: 15px; color: var(--muted); }
  .evo { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; margin: 6px 0 16px; }
  .evo figure { margin: 0; }
  .evo img { width: 100%; max-width: 100%; display: block; border: 1px solid var(--line); border-radius: 8px; }
  .evo figcaption { font: 500 10.5px var(--font-mono); letter-spacing: .06em; text-transform: uppercase; text-align: center; margin-top: 5px; color: var(--muted); }
  .evo-d .evo { margin-top: 10px; }
  .evo-d { margin-bottom: 18px; }
  .titleblock { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr 1fr; margin-top: 22px; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; font-size: 12.5px; background: var(--paper); }
  .titleblock div { padding: 9px 12px; border-left: 1px solid var(--line); min-width: 0; }
  .titleblock div:first-child { border-left: 0; }
  .titleblock small { display: block; font: 500 10px var(--font-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .titleblock b { font: 600 16px/1.2 var(--font-display); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
  .review-learn { margin-top: 20px; }
  .review-learn div { display: flex; flex-wrap: wrap; gap: 6px; }

  /* deploy toasts */
  #toasts { position: fixed; left: var(--gap-l); bottom: 140px; display: grid; gap: 6px; z-index: 6; pointer-events: none; }
  .toast { display: flex; align-items: center; gap: 10px; padding: 8px 14px 8px 10px; font-size: 13px; animation: toastIn .45s var(--ease-out); transition: opacity .4s, transform .4s; }
  @keyframes toastIn { from { opacity: 0; transform: translateX(-20px); } }
  .toast .gx { width: 26px; height: 26px; } .toast .gx.emo { font-size: 19px; }
  .toast small { display: block; font: 500 10.5px var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .toast.out { opacity: 0; transform: translateX(-12px); }
  .toast { display: block; width: 330px; }
  .imp-h { display: flex; align-items: center; gap: 10px; }
  .imp { list-style: none; margin: 8px 0 0; padding: 8px 0 0; border-top: 1px solid var(--line); display: grid; gap: 4px; font-size: 12.5px; }
  .imp li { display: flex; gap: 7px; align-items: baseline; }
  .imp li::before { font: 600 11px var(--font-mono); flex: none; width: 12px; }
  .imp li.up::before { content: '+'; color: var(--good); }
  .imp li.down::before { content: '−'; color: var(--bad); }
  .imp-why { margin: 8px 0 0; padding: 8px 10px; background: #fff6e3; border-radius: 8px; font-size: 12.5px; line-height: 1.45; color: var(--ink-2); }
  .toast.trap { border-color: var(--warn); }
  .toast.bad { border-color: var(--bad); border-left: 3px solid var(--bad); }
  .toast.bad b { color: var(--bad); }

  /* inspector */
  #insp { position: fixed; z-index: 8; width: 280px; padding: 14px 16px 15px; pointer-events: auto; animation: pop .25s var(--ease-out); }
  #insp[hidden] { display: none; }
  .insp-x { position: absolute; top: 6px; right: 8px; border: none; background: none; font-size: 20px; line-height: 1; color: var(--muted); padding: 4px 6px; border-radius: 8px; }
  .insp-x:hover { color: var(--ink); background: var(--paper-2); }
  .insp-h { display: flex; gap: 10px; align-items: center; padding-right: 16px; }
  .insp-h b { display: block; font: 600 18px/1.1 var(--font-display); }
  .insp-h small { font: 500 10.5px var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  #insp p { margin: 10px 0 0; font-size: 13.5px; }
  #insp dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; margin: 12px 0 0; padding-top: 10px; border-top: 1px solid var(--line); font-size: 13px; align-items: center; }
  #insp dt { font: 500 10.5px var(--font-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); } #insp dd { margin: 0; font-variant-numeric: tabular-nums; }
  #insp .g { display: block; height: 4px; border-radius: 3px; background: var(--paper-3); overflow: hidden; margin-top: 4px; }
  #insp .g i { display: block; height: 100%; }
  #insp .bad { color: var(--bad); } #insp .warn { color: var(--warn); } #insp .ok { color: var(--good); }
  .insp-learn { margin-top: 12px; }

  /* architecture diagram (debrief) */
  .arch-wrap { margin: 10px 0 12px; padding: 10px; border: 1px solid var(--line); border-radius: var(--r); background: var(--paper) radial-gradient(rgba(18,20,23,.16) 1px, transparent 1.2px) 0 0 / 16px 16px; overflow-x: auto; }
  svg.arch { display: block; width: 100%; height: auto; min-width: 560px; }
  svg.arch[hidden] { display: none; }
  .arch .wires line { stroke: var(--ink); stroke-width: 1.4; }
  .arch marker path { fill: var(--ink); }
  .arch .tile rect { fill: var(--card); stroke: var(--ink); stroke-width: 1.2; }
  .arch .tile.ext rect { fill: var(--paper-2); stroke: var(--muted); stroke-dasharray: 5 4; }
  .arch .tile.trap rect { stroke: var(--warn); stroke-width: 2; }
  .arch text { text-anchor: middle; font-family: var(--font-body); }
  .arch .nm { font-size: 13.5px; font-weight: 600; fill: var(--ink); }
  .arch .pd { font-size: 10px; fill: var(--muted); font-family: var(--font-mono); }
  .arch .tile.users rect { fill: var(--note); }
  .arch .frame rect { fill: rgba(36,72,245,.05); stroke: var(--blue); stroke-width: 1.3; stroke-dasharray: 7 5; }
  .arch .frame.trap rect { fill: rgba(207,122,6,.06); stroke: var(--warn); }
  .arch .fl { text-anchor: start; font-size: 11px; font-weight: 600; fill: var(--ink); font-family: var(--font-mono); letter-spacing: .06em; }
  .arch .emo { font-size: 22px; }
  .arch .tile.miss rect { fill: var(--blue-bg); stroke: var(--blue); stroke-width: 2; }
  .arch .mb { fill: var(--blue); font-weight: 600; letter-spacing: .1em; }
  .fig-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 4px; }
  .fig-head h3 { margin: 0; }
  .segment.sm button { padding: 6px 13px; font-size: 12px; }
  .fig-note { margin: -4px 0 12px; font-size: 13px; color: var(--muted); }

  /* shared learn bits used inside game cards */
  .learn-link { display: inline-flex; align-items: center; gap: 6px; border: 1px solid rgba(36,72,245,.3); background: var(--blue-bg); color: var(--blue-2); border-radius: 999px; padding: 5px 12px; font-size: 12.5px; font-weight: 500; transition: border-color .15s, background .15s, transform .2s var(--ease-out); }
  .learn-link:hover { border-color: var(--blue); background: #dde2ff; transform: translateY(-1px); }
  .learn-inline { margin-top: 14px; }

  /* ════════════════════════════════════ HOME: the exercise picker */
  #home { position: fixed; inset: 0; z-index: 12; overflow-y: auto; overflow-x: hidden; background: var(--paper); scrollbar-width: thin; }
  #home[hidden] { display: none; }
  .topbar { display: flex; align-items: center; gap: 20px; height: 60px; padding: 0 max(32px, calc((100vw - 1320px) / 2 + 32px)); border-bottom: 1px solid var(--line); background: var(--paper); }
  .logo { display: inline-flex; align-items: center; gap: 10px; font: 600 15px var(--font-body); letter-spacing: -.01em; }
  .logo-mark { width: 26px; height: 26px; }
  .topnav { display: flex; gap: 4px; margin-left: auto; align-items: center; }
  .topnav a { font: 500 13.5px var(--font-body); color: var(--ink); padding: 8px 12px; border-radius: 8px; border: 0; background: none; transition: background .15s; display: inline-flex; gap: 8px; align-items: center; }
  .topnav a:hover { background: var(--paper-2); }
  .tn-meta { font: 500 11px var(--font-mono); color: var(--muted); }

  .picker { width: 100%; max-width: 1320px; margin: 0 auto; padding: 30px 32px 28px; display: grid; grid-template-columns: minmax(360px, .85fr) minmax(0, 1.15fr); gap: 56px; align-items: start; }
  .pk-l h1 { font-size: 34px; line-height: 1.1; letter-spacing: -.025em; margin: 0 0 14px; }
  .pk-l h1 em { font-style: normal; color: var(--blue); }
  .lead { font-size: 15.5px; line-height: 1.55; color: var(--ink-2); margin: 0; max-width: 34em; }
  .pk-list-h { display: flex; justify-content: space-between; align-items: baseline; margin: 30px 0 8px; }
  .pk-list-h h3 { margin: 0; }
  .pk-list-h span { font: 500 11px var(--font-mono); color: var(--muted); display: inline-flex; gap: 3px; align-items: center; }
  .pk-list-h kbd { font-size: 10px; padding: 1px 5px; }
  .pk-list { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
  .ex { width: 100%; display: grid; grid-template-columns: 30px minmax(0, 1fr) auto 26px; gap: 14px; align-items: center; padding: 9px 12px 9px 10px; border: 0; border-bottom: 1px solid var(--line); background: none; text-align: left; transition: background .15s, box-shadow .15s; }
  .ex:hover { background: rgba(255,255,255,.6); }
  .ex[aria-selected="true"] { background: var(--card); box-shadow: inset 3px 0 0 var(--blue); }
  .ex:focus-visible { outline-offset: -2px; }
  .ex-n { font: 500 11px var(--font-mono); color: var(--muted); padding-left: 4px; }
  .ex[aria-selected="true"] .ex-n { color: var(--blue); }
  .ex-t { min-width: 0; display: flex; align-items: baseline; gap: 10px; }
  .ex-t b { font-size: 15px; font-weight: 600; white-space: nowrap; }
  .ex-t small { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ex-g { font: 600 12px var(--font-mono); text-align: center; color: var(--line); }
  .g-S, .g-A { color: var(--good) !important; } .g-B { color: var(--blue) !important; } .g-C { color: var(--warn) !important; } .g-D, .g-F { color: var(--bad) !important; }
  /* difficulty: a four-step meter in ink (color is reserved for what happens on the board) */
  .diff { display: inline-flex; align-items: center; gap: 8px; font: 500 10.5px var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
  .diff::before { content: ''; width: 23px; height: 7px; --f: 25%; background: linear-gradient(90deg, var(--ink) var(--f), var(--paper-3) var(--f)); -webkit-mask: repeating-linear-gradient(90deg, #000 0 5px, transparent 5px 6px); mask: repeating-linear-gradient(90deg, #000 0 5px, transparent 5px 6px); }
  .diff[data-d="medium"]::before { --f: 50%; } .diff[data-d="hard"]::before { --f: 75%; } .diff[data-d="expert"]::before { --f: 100%; }
  .pk-keys { margin: 10px 0 0; font-size: 12px; color: var(--muted); display: flex; gap: 4px; align-items: center; }

  .pk-r { position: sticky; top: 24px; }
  .board-panel { background: var(--card); border: 1px solid var(--hair); border-radius: 18px; box-shadow: var(--shadow); overflow: hidden; }
  .pn-body { padding: 20px 28px 0; }
  .pn-body.in { animation: pnIn .35s var(--ease-out); }
  @keyframes pnIn { from { opacity: 0; transform: translateY(6px); } }
  .pn-top { display: flex; align-items: center; gap: 16px; font: 500 11px var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .pn-no { color: var(--ink); }
  .pn-best { margin-left: auto; }
  .pn-best b { font-size: 13px; margin-left: 4px; }
  .pn-t { font-size: 30px; line-height: 1.05; letter-spacing: -.03em; margin: 10px 0 0; }
  .pn-t span { display: block; margin-top: 4px; font-size: 14.5px; font-weight: 400; letter-spacing: 0; color: var(--muted); }
  .pn-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; }
  .err { text-align: right; flex: none; }
  .err small { display: block; font: 500 10.5px var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .err b { display: block; font: 500 30px/1.1 var(--font-mono); letter-spacing: -.04em; color: var(--good); font-variant-numeric: tabular-nums; transition: color .3s; }
  .err.bad b { color: var(--bad); }
  .prompt { margin: 14px 0 0; font: 400 19px/1.42 var(--font-hand); color: var(--ink); text-wrap: pretty; }
  .prompt::before { content: 'The interviewer says'; display: block; margin-bottom: 4px; font: 500 10.5px var(--font-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--blue); }

  /* the stage: the starting system, live */
  .stage { margin: 16px 0 0; padding: 10px 12px 10px; border: 1px solid var(--line); border-radius: 14px; background: var(--paper) radial-gradient(#d9d9d2 1px, transparent 1.3px) 0 0 / 18px 18px; }
  .stage figcaption { display: flex; align-items: center; gap: 12px; font: 500 10.5px var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .st-ph { color: var(--ink); }
  .st-surge { margin-left: auto; padding: 3px 8px; border-radius: 99px; background: var(--bad); color: #fff; letter-spacing: .06em; animation: pulse 1s ease-in-out infinite; }
  .st-surge[hidden] { display: none; }
  .dia { display: block; width: 100%; height: auto; overflow: visible; }
  .dia text { font-family: var(--font-body); }
  .dia .wires line { stroke: var(--ink); stroke-width: 1.3; }
  .dia .wires line.d { stroke-dasharray: 5 4; }
  .dia .nd rect:first-child { fill: var(--card); stroke: var(--ink); stroke-width: 1.3; transition: fill .3s, stroke .3s; }
  .dia .nd.users rect:first-child { fill: #fff6cf; }
  .dia .nd.ext rect:first-child { fill: var(--paper); stroke: var(--muted); stroke-dasharray: 5 4; }
  .dia .nm { font-size: 12.5px; font-weight: 600; fill: var(--ink); }
  .dia .pc { font: 500 10px var(--font-mono); fill: var(--muted); }
  .dia .emo { font-size: 17px; }
  .dia .gb { fill: var(--paper-3); }
  .dia .gf { fill: var(--good); }
  .dia .warm .gf { fill: var(--warn); }
  .dia .hot rect:first-child { fill: #fff0ec; stroke: var(--bad); stroke-width: 2; animation: hot .7s ease-in-out infinite alternate; }
  .dia .hot .gf { fill: var(--bad); }
  .dia .hot .pc { fill: var(--bad); font-weight: 600; }
  @keyframes hot { to { stroke-width: 3.5; } }
  .stage .kinds { margin-top: 4px; }

  /* the run: phases on a timeline, with the stage's playhead */
  .tl { position: relative; margin-top: 14px; }
  .tr { display: block; width: 100%; height: 44px; }
  .tr rect { shape-rendering: crispEdges; }
  .tl-fog { fill: var(--card); opacity: .72; }
  .tl-ph { position: absolute; top: -5px; bottom: -3px; left: 0; width: 2px; margin-left: -1px; background: var(--ink); border-radius: 2px; }
  .tl-ph::before { content: ''; position: absolute; top: -3px; left: -3px; width: 8px; height: 8px; border-radius: 50%; background: var(--ink); }
  .tr-ph { display: flex; margin-top: 6px; }
  .tr-ph span { min-width: 0; padding: 0 6px 0 0; font: 500 10.5px var(--font-mono); letter-spacing: .04em; text-transform: uppercase; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: color .3s; }
  .tr-ph b { font-weight: 500; margin-right: 6px; }
  .tr-ph span.on { color: var(--ink); }
  .tr-ph span.on b { color: var(--blue); }
  .kinds { display: flex; flex-wrap: wrap; gap: 2px 14px; font-size: 12px; color: var(--ink-2); }
  .kinds i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }
  .verdict { margin: 14px 0 0; font-size: 14px; line-height: 1.5; color: var(--ink-2); text-wrap: pretty; }
  .verdict b { color: var(--bad); font-weight: 600; }
  .verdict span { color: var(--ink); font-weight: 600; }
  .topics { margin: 8px 0 16px; font-size: 13px; color: var(--muted); }
  .topics b { font: 500 10.5px var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink); margin-right: 10px; }
  .pn-foot { display: flex; align-items: center; justify-content: space-between; gap: 24px; padding: 14px 28px; border-top: 1px solid var(--line); background: var(--paper); }
  .pn-mode { min-width: 0; }
  .mode-note { margin: 8px 0 0; font-size: 12.5px; color: var(--muted); max-width: 34em; }
  .segment { display: inline-grid; grid-template-columns: 1fr 1fr; position: relative; padding: 3px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); }
  .segment button { position: relative; z-index: 1; border: 0; background: none; padding: 7px 16px; border-radius: 7px; font: 500 13px var(--font-body); transition: color .3s; white-space: nowrap; }
  .segment button[aria-checked="true"] { color: #fff; }
  .segment::before { content: ''; position: absolute; top: 3px; bottom: 3px; left: 3px; width: calc(50% - 3px); border-radius: 7px; background: var(--ink); transition: transform .35s var(--ease-out); }
  .segment[data-v="interview"]::before { transform: translateX(100%); }
  .btn.lg { padding: 14px 22px; font-size: 15px; flex: none; }
  .pn-start-t { font-weight: 600; }
  .btn .arr { display: inline-flex; transition: transform .25s var(--ease-out); }
  .btn:hover .arr { transform: translateX(3px); }

  /* how a round goes */
  .loop { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 10px 24px; border-top: 1px solid var(--line); padding-top: 14px; }
  .loop li { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 10px; align-items: center; font-size: 13px; line-height: 1.35; color: var(--muted); }
  .loop b { width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--ink); display: grid; place-items: center; font: 500 11px var(--font-mono); color: var(--ink); background: var(--card); }
  .loop strong { color: var(--ink); font-weight: 600; }

  /* ════════════════════════════════════ FIELD GUIDE (learn)
     A quiet contents column and one reading column. Same vocabulary as the picker:
     white rows on the board, a blue rule marks where you are, green ✓ means checked. */
  #learn { position: fixed; inset: 0; z-index: 20; background: var(--paper); display: grid; grid-template-columns: 264px minmax(0, 1fr); animation: fmIn .25s var(--ease-out); }
  #learn[hidden] { display: none; }
  @keyframes fmIn { from { opacity: 0; } }
  .fg-nav { display: grid; grid-template-rows: auto auto auto auto 1fr; min-height: 0; padding: 16px 0 0; border-right: 1px solid var(--line); }
  .fg-back { justify-self: start; margin: 0 16px 18px; display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px 6px 6px; border: 0; border-radius: 8px; background: none; font: 500 13px var(--font-body); color: var(--muted); transition: background .15s, color .15s; }
  .fg-back:hover { background: var(--paper-2); color: var(--ink); }
  .fg-back .i { width: 16px; height: 16px; }
  .fg-title { display: block; justify-self: start; margin: 0 20px; padding: 0; border: 0; background: none; font: 600 20px/1.2 var(--font-display); letter-spacing: -.02em; }
  .fg-prog { margin: 10px 20px 14px; display: grid; gap: 6px; }
  .fg-prog span { height: 3px; border-radius: 2px; background: var(--paper-3); overflow: hidden; }
  .fg-prog i { display: block; height: 100%; width: 0; background: var(--blue); transition: width .4s var(--ease-out); }
  .fg-prog small { font: 500 11px var(--font-mono); color: var(--muted); }
  .learn-q { width: calc(100% - 32px); margin: 0 16px 6px; padding: 9px 12px 9px 34px; font: 13.5px var(--font-body); border: 1px solid var(--line); border-radius: 10px; background: var(--card) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' fill='none' stroke='%236b7079' stroke-width='1.6'><circle cx='7' cy='7' r='5'/><path d='m11 11 3.5 3.5'/></svg>") 11px 50% no-repeat; color: var(--ink); }
  .learn-q:focus { outline: none; border-color: var(--ink); }
  .fm-toc { overflow-y: auto; padding: 4px 10px 28px; scrollbar-width: thin; min-height: 0; }
  .fm-toc h4 { margin: 18px 10px 4px; font: 500 10.5px var(--font-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .fm-toc a { display: flex; cursor: pointer; align-items: center; gap: 8px; width: 100%; padding: 6px 10px; border: 0; background: none; text-align: left; border-radius: 7px; font-size: 13.5px; line-height: 1.35; color: var(--ink-2); transition: background .15s, opacity .2s; }
  .fm-toc a:hover { background: var(--paper-2); }
  .fm-toc a.on { background: var(--card); color: var(--ink); font-weight: 600; box-shadow: inset 3px 0 0 var(--blue); }
  .fm-toc a.dim { opacity: .3; }
  .fm-toc a.on.dim { opacity: 1; }
  .fm-toc a.read::after { content: ''; margin-left: auto; flex: none; width: 5px; height: 5px; border-radius: 50%; background: var(--paper-3); }
  .fm-toc a.passed::after { content: '✓'; width: auto; height: auto; background: none; color: var(--good); font-size: 12px; }
  .fm-main { overflow-y: auto; min-height: 0; position: relative; scrollbar-width: thin; }
  .fm-main:focus { outline: none; }
  .fm-progress { position: sticky; top: 0; height: 2px; z-index: 2; }
  .fm-progress i { display: block; height: 100%; width: 0; background: var(--blue); }
  .fm-page h1 { font-size: 38px; line-height: 1.08; letter-spacing: -.03em; margin: 0; }

  /* contents page: a hero with your progress map, then each chapter as a row of cards */
  .fm-page { max-width: 1080px; margin: 0 auto; padding: 48px 44px 96px; }
  .fg-hero { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 48px; align-items: center; padding-bottom: 40px; border-bottom: 1px solid var(--line); }
  .fg-hero h1 { font-size: 44px; letter-spacing: -.035em; }
  .fg-sub { margin: 8px 0 0; font: 400 22px/1.35 var(--font-hand); color: var(--blue); }
  .fg-hero > div > p:not(.fg-sub) { margin: 16px 0 24px; font-size: 15.5px; line-height: 1.6; color: var(--ink-2); max-width: 32em; }
  .fg-hero .btn b { font-weight: 600; }
  .pmap { margin: 0; padding: 20px 22px; background: var(--card); border: 1px solid var(--hair); border-radius: 16px; box-shadow: var(--shadow); }
  .pmap figcaption { display: flex; align-items: baseline; gap: 4px; margin-bottom: 14px; font: 500 12px var(--font-mono); color: var(--muted); }
  .pmap figcaption b { font-size: 26px; font-weight: 500; letter-spacing: -.04em; color: var(--ink); }
  .pmap figcaption span { margin-left: auto; color: var(--good); }
  .pm-row { display: grid; grid-template-columns: 130px minmax(0, 1fr); gap: 10px; align-items: center; padding: 4px 0; }
  .pm-row > span { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pm-row > div { display: flex; flex-wrap: wrap; gap: 4px; }
  .pm-sq { width: 18px; height: 18px; border-radius: 5px; background: var(--paper-2); box-shadow: inset 0 0 0 1px var(--line); transition: transform .15s; }
  .pm-sq:hover { transform: scale(1.2); box-shadow: inset 0 0 0 1.5px var(--ink); }
  .pm-sq.read { background: var(--blue); box-shadow: none; }
  .pm-sq.passed { background: var(--good); box-shadow: none; }
  .pm-key { display: flex; align-items: center; gap: 6px; margin: 12px 0 0; font-size: 11.5px; color: var(--muted); }
  .pm-key i { width: 10px; height: 10px; border-radius: 3px; background: var(--paper-2); box-shadow: inset 0 0 0 1px var(--line); margin-left: 8px; }
  .pm-key i:first-child { margin-left: 0; }
  .pm-key i.read { background: var(--blue); box-shadow: none; } .pm-key i.passed { background: var(--good); box-shadow: none; }

  .fg-chap { margin-top: 44px; animation: fadeUp .45s var(--ease-out) both; animation-delay: calc(var(--d, 0) * 50ms); }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } }
  .fg-chap header { display: flex; align-items: baseline; gap: 12px; margin-bottom: 14px; }
  .fg-chap-n { font: 500 12px var(--font-mono); color: var(--blue); }
  .fg-chap h2 { margin: 0; font-size: 20px; letter-spacing: -.02em; }
  .fg-chap header small { margin-left: auto; font: 500 11px var(--font-mono); color: var(--muted); }
  .fg-cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
  .fg-card { position: relative; display: grid; grid-template-rows: auto auto 1fr auto; gap: 6px; padding: 12px 12px 14px; background: var(--card); border: 1px solid var(--hair); border-radius: 14px; transition: transform .25s var(--ease-out), box-shadow .25s, border-color .2s; }
  .fg-card:hover { transform: translateY(-3px); border-color: var(--ink); box-shadow: var(--shadow); }
  .fg-card b { margin-top: 6px; padding: 0 4px; font-size: 15.5px; font-weight: 600; letter-spacing: -.01em; }
  .fg-card small { padding: 0 4px; font-size: 13px; line-height: 1.45; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .fg-st { margin-top: 8px; padding: 0 4px; font: 500 10.5px var(--font-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .fg-card.read .fg-st { color: var(--blue); }
  .fg-card.passed .fg-st { color: var(--good); }
  .fg-card.read .fg-st::before, .fg-card.passed .fg-st::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .fg-card.passed .fg-st::before { content: '✓'; width: auto; height: auto; background: none; font-size: 12px; }
  /* the mini board on each card */
  .mf { height: 64px; display: flex; align-items: center; justify-content: center; gap: 0; border-radius: 9px; background: var(--paper) radial-gradient(#d9d9d2 1px, transparent 1.3px) 0 0 / 12px 12px; }
  .mf-n { width: 32px; height: 32px; display: grid; place-items: center; background: var(--card); border: 1px solid var(--ink); border-radius: 8px; }
  .mf-n .gx { width: 18px; height: 18px; } .mf-n .gx.emo { font-size: 15px; }
  .mf-n.more { border-style: dashed; color: var(--muted); font-size: 13px; }
  .mf-a { width: 18px; height: 1.4px; background: var(--ink); position: relative; }
  .mf-a::after { content: ''; position: absolute; right: -1px; top: -3px; border: 3.7px solid transparent; border-left: 5px solid var(--ink); border-right: 0; }
  .mf-emo { font-size: 28px; }
  .fm-empty { padding: 40px 0; font-size: 15px; color: var(--muted); }

  /* a primer: one reading column and a rail */
  .fg-spread { display: grid; grid-template-columns: minmax(0, 700px) 210px; gap: 56px; justify-content: center; }
  .fg-crumb { display: flex; gap: 10px; align-items: center; margin-bottom: 18px; font: 500 11px var(--font-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .fg-crumb a { font: inherit; letter-spacing: inherit; text-transform: inherit; color: var(--blue) !important; }
  .fg-crumb a::after { content: '/'; margin-left: 10px; color: var(--paper-3); }
  .fg-head { display: flex; align-items: center; gap: 16px; }
  .fg-ic { flex: none; width: 52px; height: 52px; display: grid; place-items: center; font-size: 26px; background: var(--card); border: 1px solid var(--hair); border-radius: 14px; box-shadow: var(--shadow); }
  .fg-head h1 { font-size: 40px; letter-spacing: -.035em; line-height: 1.05; margin: 0; }
  .idea { margin: 20px 0 0; font-size: 20px; line-height: 1.55; color: var(--ink); text-wrap: pretty; }
  .fg-sec { margin-top: 44px; scroll-margin-top: 24px; }
  .fg-sec > h3 { margin: 0 0 14px; }
  .board { display: grid; gap: 10px; padding: 16px; border: 1px solid var(--line); border-radius: 16px; background: var(--paper) radial-gradient(#d9d9d2 1px, transparent 1.3px) 0 0 / 18px 18px; }
  .flow { padding: 14px 16px 16px; border: 1px solid var(--hair); border-radius: 12px; background: rgba(255,255,255,.9); }
  .flow.bad { border-color: #f1c2b9; } .flow.good { border-color: #a9d8bc; }
  .flow-l { display: inline-flex; align-items: center; gap: 7px; margin-bottom: 12px; font: 500 10.5px var(--font-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .flow-l::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .flow.bad .flow-l { color: var(--bad); } .flow.good .flow-l { color: var(--good); }
  .flow-row { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 4px; }
  .fn { display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px 8px 9px; background: var(--card); border: 1px solid var(--ink); border-radius: 10px; font-size: 13px; font-weight: 600; box-shadow: 0 4px 10px -8px rgba(21,23,28,.5); }
  .fn .gx { width: 20px; height: 20px; } .fn .gx.emo { font-size: 17px; }
  .fa { position: relative; display: inline-flex; flex-direction: column; align-items: center; justify-content: flex-end; min-width: 46px; min-height: 30px; padding: 0 4px 10px; }
  .fa i { font: 400 13px/1.1 var(--font-hand); color: var(--muted); white-space: nowrap; font-style: normal; }
  .fa::after { content: ''; position: absolute; left: 0; right: 4px; bottom: 6px; border-top: 1.4px dashed var(--ink); }
  .fa::before { content: ''; position: absolute; right: -1px; bottom: 2px; border: 5px solid transparent; border-left: 7px solid var(--ink); border-right: 0; }
  .fa b { position: absolute; bottom: 3px; left: 0; width: 7px; height: 7px; border-radius: 50%; background: var(--blue); animation: packet 1.8s var(--ease) infinite; }
  .flow.bad .fa b { background: var(--bad); } .flow.good .fa b { background: var(--good); }
  @keyframes packet { from { left: 0; opacity: 0; } 15% { opacity: 1; } 85% { opacity: 1; } to { left: calc(100% - 12px); opacity: 0; } }
  .learn-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .learn-cols > div { padding: 16px 18px; background: var(--card); border: 1px solid var(--hair); border-radius: 14px; border-top: 3px solid var(--good); }
  .learn-cols > .r { border-top-color: var(--bad); }
  .learn-cols h4 { margin: 0 0 10px; font-size: 14px; font-weight: 600; }
